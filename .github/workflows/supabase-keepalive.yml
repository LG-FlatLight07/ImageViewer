name: Supabase Keep-Alive

# Supabase's free tier auto-pauses a project after ~7 days with no API
# activity. This workflow pings the project's REST API on a schedule so it
# never goes quiet long enough to be paused.

on:
  schedule:
    # Every 3 days at 03:00 UTC — well inside the ~7 day inactivity window.
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set. See README for setup." >&2
            exit 1
          fi

          http_code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "${SUPABASE_URL}/rest/v1/ranking_daily_counts?select=url_key&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP $http_code"
          if [ "$http_code" -ge 400 ]; then
            exit 1
          fi
